services:
  db:
    image: postgres:16-alpine
    container_name: inventario-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventario}
      POSTGRES_DB: ${POSTGRES_DB:-inventario}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # <- volumen: los datos sobreviven aunque borres el contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventario}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: inventario-api:1.0.0           # <- nombre de la imagen
    container_name: inventario-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inventario}:${POSTGRES_PASSWORD:-inventario}@db:5432/${POSTGRES_DB:-inventario}
      API_KEY: ${API_KEY:-}
      ENVIRONMENT: docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: inventario-n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_SECURE_COOKIE: "false"               # necesario para abrirlo en http://localhost
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"    # deja que el flujo lea las variables de abajo
      INVENTARIO_URL: ${INVENTARIO_URL:-https://inventario-api-qu64.onrender.com}
      INVENTARIO_API_KEY: ${INVENTARIO_API_KEY:-}
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n               # <- volumen: tus flujos y cuenta de n8n persisten
      - ./n8n:/workflows:ro                   # el flujo listo para importar

volumes:
  pgdata:
    name: inventario_pgdata
  n8ndata:
    name: inventario_n8ndata
